{{define "base"}}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VaultMail</title>
  <style>
    :root {
      --bg: #f7f2ea;
      --ink: #1b1b1b;
      --muted: #5f5f5f;
      --accent: #1463ff;
      --accent-2: #ff9b00;
      --card: #ffffff;
      --border: #e2d8cc;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Spectral", "Georgia", serif;
      color: var(--ink);
      background: radial-gradient(circle at top left, #fffaf3, var(--bg));
    }
    header {
      padding: 24px 24px 16px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(90deg, #fff7e7, #f6efe4);
    }
    header h1 {
      margin: 0 0 6px;
      font-size: 28px;
      letter-spacing: 0.5px;
    }
    header p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }
    .container {
      max-width: none;
      margin: 0;
      padding: 24px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 200px;
      gap: 20px;
    }
    .sidebar {
      background: #fffaf1;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      font-size: 13px;
      color: var(--muted);
      display: grid;
      gap: 10px;
      height: fit-content;
    }
    .sidebar h3 {
      margin: 0;
      font-size: 14px;
      color: var(--ink);
    }
    .sidebar .stat {
      display: flex;
      justify-content: space-between;
      font-weight: 600;
      color: var(--ink);
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 12px;
    }
    .topbar a {
      text-decoration: none;
      color: var(--ink);
      font-weight: 600;
    }
    .topbar .nav {
      display: flex;
      gap: 12px;
      align-items: center;
      font-size: 13px;
      color: var(--muted);
    }
    .topbar .nav a {
      color: var(--accent);
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.04);
    }
    .filters {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: end;
    }
    label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 6px; }
    input[type="text"] {
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #fff;
    }
    .btn {
      padding: 8px 14px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn.secondary {
      background: #2f2f2f;
    }
    .list {
      margin-top: 18px;
      display: grid;
      gap: 12px;
    }
    .row {
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #fff;
      display: grid;
      grid-template-columns: 140px 1.1fr 1.1fr 2fr 1fr auto;
      gap: 12px;
      align-items: center;
    }
    .header-row {
      background: transparent;
      border: none;
      padding: 0 12px;
      font-weight: 600;
    }
    .row a { color: var(--ink); text-decoration: none; }
    .row a:hover { text-decoration: underline; }
    .muted { color: var(--muted); font-size: 12px; }
    .pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      background: #f1e3c9;
      color: #7a4d00;
      margin-left: 6px;
    }
    .pill.warn { background: #ffe2df; color: #a53b2b; }
    .pager {
      margin-top: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }
    .pager a { color: var(--accent); text-decoration: none; }
    .message-header {
      display: grid;
      gap: 6px;
      margin-bottom: 16px;
    }
    .body {
      white-space: pre-wrap;
      font-family: "Literata", "Georgia", serif;
      font-size: 14px;
      line-height: 1.55;
      color: #242424;
    }
    .attachments {
      margin-top: 16px;
      display: grid;
      gap: 8px;
    }
    .toolbar {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
      align-items: center;
    }
    .toolbar a {
      text-decoration: none;
    }
    .attachment {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #faf7f2;
    }
    @media (max-width: 900px) {
      .filters { grid-template-columns: 1fr; }
      .row { grid-template-columns: 1fr; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>VaultMail</h1>
    <p>Local Gmail MBOX archive browser</p>
    <div class="topbar">
      <div class="nav">
        <span>Navigate:</span>
        <a href="/">Inbox</a>
      </div>
      <div class="nav">
        <span>Tips:</span>
        <span>Search is full-text</span>
      </div>
    </div>
  </header>
  <div class="container">
    <div class="grid">
      <main>
        {{template "content" .}}
      </main>
      <aside class="sidebar">
        <h3>VaultMail</h3>
        <div class="stat"><span>Status</span><span>Local</span></div>
        <div class="stat"><span>Mode</span><span>Read</span></div>
        <div class="stat"><span>Tips</span><span>Use search</span></div>
        <div>
          <h3>Search</h3>
          <div class="muted">Examples:</div>
          <div class="muted">from:alice subject:"invoice"</div>
          <div class="muted">date:>=2025-01-01 att:>1M</div>
          <div class="muted">body:"red carpet"</div>
        </div>
      </aside>
    </div>
  </div>
</body>
</html>
{{end}}
